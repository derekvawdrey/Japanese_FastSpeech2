dataset: "kokoro"

path:
  corpus_path: "/Users/derekvawdrey/Workspace/School/Japanese_FastSpeech2/raw_data"
  lexicon_path: "/Users/derekvawdrey/Workspace/School/Japanese_FastSpeech2/lexicon/japanese_mfa.dict"
  raw_path: "/Users/derekvawdrey/Workspace/School/Japanese_FastSpeech2/raw_data"
  preprocessed_path: "/Users/derekvawdrey/Workspace/School/Japanese_FastSpeech2/preprocessed_data/female_no_pitch"

preprocessing:
  val_size: 512
  text:
    text_cleaners: []
    language: "ja"
    mfa_g2p_model_path: "japanese_mfa"
  audio:
    sampling_rate: 22050
    max_wav_value: 32768.0
  stft:
    filter_length: 1024
    hop_length: 256
    win_length: 1024
  mel:
    n_mel_channels: 80
    mel_fmin: 0
    mel_fmax: 8000 # please set to 8000 for HiFi-GAN vocoder, set to null for MelGAN vocoder
  pitch:
    feature: "phoneme_level" # support 'phoneme_level' or 'frame_level'
    normalization: True
  energy:
    feature: "phoneme_level" # support 'phoneme_level' or 'frame_level'
    normalization: True
